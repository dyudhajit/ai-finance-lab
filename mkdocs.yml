site_name: AI Finance Lab
site_description: Building the next generation of AI-enabled finance professionals
site_url: ""

theme:
  name: material
  logo: assets/4MATR Logo.png
  favicon: assets/4MATR Logo.png

  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html

nav:

  - Home: index.md

  - Start Here:
      - About AI Finance Lab: about.md
      - Learning Roadmap: learning-roadmap.md
      - Self-learning Resources: resources.md
      - Contribute: contribute.md

  - Learn:
    - Finance Foundations:
        - Accounting Fundamentals:
            - Overview: Accounting Fundamentals/learn Accounting fundamentals.md

        - Finance Fundamentals:
            - Overview: Finance Fundamentals/learn FSA fundamentals.md

        - Modelling Fundamentals:
            - Overview: Modelling Fundamentals/learn Modelling fundamentals.md
            - FM Mechanics: Modelling Fundamentals/learn FM mechanics.md
            - DCF Mechanics: Modelling Fundamentals/learn DCF mechanics.md
            - LBO Mechanics: Modelling Fundamentals/learn LBO mechanics.md
            - Merger Mechanics: Modelling Fundamentals/learn Merger mechanics.md

    - AI Foundations:
        - AI Fundamentals:
            - Overview: AI Fundamentals/learn AI Fundamentals.md
            - Prompt Engineering : AI Fundamentals/learn Prompt Engineering.md
            - AI Model Auditing : AI Fundamentals/learn AI Model Auditing.md
            - AI-Assisted Financial Modelling : AI Fundamentals/learn AI Assisted Modelling.md

  - Case Studies:
      - Breville Group:
          - About the Case Study: Case Study/Breville/about BRG.md
          - Annual Report (PDF): Case Study/Breville/Annual Report/Breville-Annual-Report-2025.pdf
          - YahooFinance Financials Export (XLSX): Case Study/Breville/Data/BRG.AX Financials.xlsx
          - Preliminary AI Assessment: 
            - FM Opinion: Case Study/Breville/Prompt Outputs/prompt FM opinion.md
            - DCF Opinion: Case Study/Breville/Prompt Outputs/prompt DCF opinion.md
            - LBO Strategy: Case Study/Breville/Prompt Outputs/prompt LBO strategy.md
            - Merger Strategy: Case Study/Breville/Prompt Outputs/prompt merger strategy.md
          - AI Model Assessment:
            - AI Financial Model v1: Case Study/Breville/Models/AI Output/FM/AI FM Assessment v1.md
            - AI Financial Model v2: Case Study/Breville/Models/AI Output/FM/AI FM Assessment v2.md
  
  - 4MATR Resources:
     - AI Financial Engineering Handbook:
          - Chapter 1: 4MATR Resources/AI Finance Handbook/Chapter 01.md
          - Chapter 2: 4MATR Resources/AI Finance Handbook/Chapter 02.md


  - 4MATR Community:
